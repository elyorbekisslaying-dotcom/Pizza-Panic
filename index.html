<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pizza Panic</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="js/art.js"></script>
  <script defer src="js/orders.js"></script>
  <script defer src="js/game.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <main class="cabinet">
    <header class="hud">
      <div><small>SCORE</small><strong id="score">0000</strong></div>
      <div><small>TIME LEFT</small><strong id="timer">1:30</strong></div>
      <div><small>LIVES</small><strong id="lives" aria-label="3 lives">♥♥♥</strong></div>
      <button id="pause" type="button" disabled>Pause <kbd>Esc</kbd></button>
    </header>
    <section class="order" id="order" hidden aria-label="Current pizza order">
      <strong id="recipe"></strong>
      <ul id="toppings" aria-label="Toppings"></ul>
      <span id="task" role="status"></span>
    </section>
    <div class="stage">
      <canvas id="kitchen" width="960" height="580" aria-label="Pizza Panic kitchen arena"></canvas>
      <section class="veil" id="overlay" aria-labelledby="title">
        <div class="card">
          <h1 id="title">Pizza <em>Panic!</em></h1>
          <p id="description">Grab fresh toppings. Dodge spoiled food and bombs.</p>
          <div id="actions"></div>
        </div>
      </section>
    </div>
    <footer><span><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> / <kbd>↑</kbd> <kbd>←</kbd> <kbd>↓</kbd> <kbd>→</kbd> Move</span><span><kbd>Esc</kbd> Pause / Resume</span></footer>
  </main>
</body>
</html>
